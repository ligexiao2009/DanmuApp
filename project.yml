name: DanmuApp
options:
  bundleIdPrefix: com.danmu
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"

settings:
  base:
    INFOPLIST_FILE: DanmuApp/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.danmu.app

targets:
  DanmuApp:
    type: application
    platform: iOS
    sources:
      - DanmuApp
    dependencies:
      - package: KSPlayer
      - package: FFmpegKit

packages:
  KSPlayer:
    path: /Users/yangyang/ios/KSPlayer
  FFmpegKit:
    path: /Users/yangyang/git/FFmpegKit
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos ipados"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "YES"
    info:
      path: DanmuApp/Info.plist
      properties:
        CFBundleName: DanmuApp
        CFBundleDisplayName: Danmu
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: ""
        UIApplicationSupportsIndirectInputEvents: YES
        UIRequiresFullScreen: YES
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
